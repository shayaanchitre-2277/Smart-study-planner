<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Smart Study Planner{% endblock %}</title>

  <!-- Google Fonts: Syne (display) + DM Sans (body) -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <!-- ── Navigation ── -->
  <nav class="navbar">
    <a href="{{ url_for('index') }}" class="nav-brand">
      <span class="brand-icon">📚</span>
      <span>StudyPlanner</span>
    </a>
    <div class="nav-links">
      <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('add_task') }}" class="btn btn-primary btn-sm">+ Add Task</a>
      <button id="theme-toggle" class="btn btn-sm">🌙</button>
    </div>
  </nav>

  <!-- ── Flash Messages ── -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-container">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">
            <span>{{ message }}</span>
            <button class="flash-close" onclick="this.parentElement.remove()">×</button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <!-- ── Page Content ── -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ── -->
  <footer class="footer">
    <p>Smart Study Planner &mdash; Stay focused, stay ahead.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
